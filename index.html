<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>U&amp;I Mart | One company. Three specialized branches.</title><meta name="description" content="Discover U&amp;I Mart: electronics in Abu Dhabi, furniture in Dubai, and hardware in Sharjah. Kitchen items across all three branches.">
<meta name="theme-color" content="#236554"><link rel="stylesheet" href="./assets/css/main.css"><link rel="stylesheet" href="./assets/css/chatbot.css"><link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg"></head>
<body data-page="home" data-theme="home"><a class="skip-link" href="#main">Skip to content</a>
<div class="topline">ONE COMPANY. THREE SPECIALIZED BRANCHES. UNITED ARAB EMIRATES.</div>
<header class="site-header" id="site-header"></header><div id="preview-notice" hidden class="preview-notice">Preview website · Products and promotions shown by the assistant are sample data.</div>
<main id="main"><p class="container status">Loading U&amp;I Mart…</p></main>
<noscript><p>This website requires JavaScript for navigation, branch information and the assistant.</p></noscript>
<footer class="site-footer" id="site-footer"></footer>
    <div class="ui-chatbot" id="uiChatbot">
        <section class="ui-chat-panel" id="uiChatPanel" role="dialog"
            aria-labelledby="uiChatTitle" aria-hidden="true">
            <header class="ui-chat-header">
                <div class="ui-chat-brand-icon" aria-hidden="true"><span aria-hidden="true">U&amp;I</span></div>
                <div class="ui-chat-heading">
                    <h2 id="uiChatTitle">U&amp;I Mart Assistant</h2>
                    <div class="ui-chat-subtitle"><span class="ui-chat-status-dot" aria-hidden="true"></span>
                        Customer Assistant</div>
                </div>
                <button class="ui-chat-close" id="uiChatClose" type="button"
                    aria-label="Close customer assistant"><span aria-hidden="true">×</span></button>
            </header>

            <div class="ui-chat-messages" id="uiChatMessages" role="log" aria-live="polite"
                aria-relevant="additions text" aria-busy="false"></div>

            <form class="ui-chat-form" id="uiChatForm">
                <label class="ui-chat-visually-hidden" for="uiChatInput">Ask the customer assistant</label>
                <input class="ui-chat-input" id="uiChatInput" type="text" maxlength="500"
                    autocomplete="off" enterkeyhint="send" placeholder="Ask about products, branches or deals...">
                <button class="ui-chat-send" id="uiChatSend" type="submit" aria-label="Send message"
                    disabled><span aria-hidden="true">↑</span></button>
            </form>
        </section>

        <button class="ui-chat-launcher" id="uiChatLauncher" type="button"
            aria-label="Open customer assistant" aria-controls="uiChatPanel" aria-expanded="false">
            <span aria-hidden="true">✦</span>
        </button>
    </div>

<script type="module" src="./assets/js/chatbot.js"></script>
<script type="module" src="./assets/js/main.js"></script></body></html>
